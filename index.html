<!DOCTYPE html>
<html lang="en">
	<head>
<meta name="description" content="Play Shatranj: Indian-inspired 3D chess with living pieces and cinematic captures.">
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Shatranj — Royal Battlefield</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="app-icon-192.png" />
<link rel="apple-touch-icon" href="app-icon-180.png"/>

	<script src="startup-recovery.js"></script><style>
#status {visibility:visible;background:#0b171b;color:#eddfbc;font-family:system-ui,sans-serif;overflow:auto}
.loading-intro {text-align:center;padding:20px}
.loading-intro h1 {font-size:24px;letter-spacing:.12em;font-weight:500;color:#e6bf72}
.loading-intro p {font-size:15px}
#status-progress {accent-color:#d5b46e;height:5px;bottom:15%;width:min(320px,75%)}
#status-notice {max-width:650px;margin:16px;flex-shrink:0}
@media(prefers-reduced-motion:reduce){*{animation:none}}
#status-notice.startup-recovery {box-sizing:border-box;width:min(560px,calc(100% - 32px));text-align:left;background:#142b2d;border:1px solid #977b4b;border-radius:14px;padding:22px;color:#ece4cf;font-size:15px;line-height:1.5}
.startup-recovery h2 {font-size:22px;color:#e6bf72;margin:0 0 12px}
.startup-recovery ol {padding-left:22px}
.startup-recovery li {margin-bottom:10px}
.startup-actions {display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.startup-actions button,.startup-actions a {font:inherit;box-sizing:border-box;border:1px solid #b39458;background:#23483e;color:#fff3d7;border-radius:8px;padding:11px 16px;min-height:44px;cursor:pointer;text-decoration:none}
.startup-recovery a {color:#ead09a;overflow-wrap:anywhere}
.startup-recovery details {margin-top:16px;font-size:13px;overflow-wrap:anywhere}
#status:has(.startup-recovery) {justify-content:flex-start;padding:32px 0 90px;box-sizing:border-box}
#status:has(.startup-recovery) .loading-intro {padding:8px}
</style>

<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#102628"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Shatranj"><link rel="stylesheet" href="install.css"><script defer src="install.js"></script><script defer src="computer.js"></script></head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<section class="loading-intro"><h1>SHATRANJ</h1><p>Loading game…</p></section>
			<progress id="status-progress" aria-label="Loading game"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js?v=mobile-11a"></script>
		<script>
const GODOT_CONFIG = {"args":["--web-loading-intro"],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":30865972,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		if (window.shatranjShowStartupFailure) window.shatranjShowStartupFailure(err);
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
